[pytest]
# Run the unit/API suite with:  py -m pytest
# (the browser test is a separate script:  py tests/smoke_test.py)
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
# pandas 3 and scikit-learn 1.8 both deprecate APIs this project deliberately avoids, so
# a FutureWarning here means the code has drifted from what the tests were validated on.
filterwarnings =
    error::FutureWarning
